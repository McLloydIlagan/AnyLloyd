<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnyLloyd</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Loading / Wake-up Screen ===== -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-card">
      <div class="loading-logo">🌸</div>
      <h1 class="loading-title">AnyLloyd</h1>
      <p class="loading-subtitle">Waking up the server…</p>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <p class="loading-hint">This takes up to 30 seconds on first launch ☕</p>
    </div>
  </div>

  <!-- ===== Header ===== -->
  <header class="app-header" style="display:none;" id="main-ui">
    <div class="logo">
      <span class="logo-icon">🌸</span>
      <span class="logo-text">AnyLloyd</span>
    </div>
    <div class="status-indicator">
      <span id="status-dot" class="status-dot idle"></span>
      <span id="status-label">Idle</span>
    </div>
  </header>

  <!-- ===== Home Screen ===== -->
  <main id="home-screen" class="home-screen" style="display:none;">

    <div class="panel">
      <div class="panel-icon">🖥️</div>
      <h2 class="panel-title">My Computer</h2>
      <p class="panel-subtitle">Let a friend see your screen</p>

      <div class="session-id-wrapper" id="session-id-wrapper" style="display:none;">
        <span class="session-id-label">✨ Your Session ID</span>
        <div class="session-id-row">
          <span id="session-id-display" class="session-id">——————</span>
          <button id="copy-btn" class="btn btn-soft" title="Copy to clipboard">📋 Copy</button>
        </div>
      </div>

      <button id="host-btn" class="btn btn-primary btn-large">🌟 Start Hosting</button>
      <button id="stop-host-btn" class="btn btn-danger" style="display:none;">🛑 Stop Hosting</button>
      <p id="host-status" class="status-text"></p>
    </div>

    <div class="panel-divider"></div>

    <div class="panel">
      <div class="panel-icon">🔗</div>
      <h2 class="panel-title">Remote Computer</h2>
      <p class="panel-subtitle">Connect to a friend's screen</p>

      <div class="input-group">
        <input
          id="session-input"
          class="text-input"
          type="text"
          maxlength="6"
          placeholder="6-digit session ID"
          autocomplete="off"
        />
        <button id="connect-btn" class="btn btn-primary">🚀 Connect</button>
      </div>
      <button id="disconnect-btn" class="btn btn-danger" style="display:none;">👋 Disconnect</button>
      <p id="viewer-status" class="status-text"></p>
    </div>

  </main>

  <!-- ===== Remote View ===== -->
  <section id="remote-view" class="remote-view" style="display:none;">
    <div class="remote-toolbar">
      <span class="remote-label">🖥️ Remote Desktop</span>
      <button id="exit-remote-btn" class="btn btn-soft btn-sm">✕ End Session</button>
    </div>
    <video id="remote-video" autoplay playsinline></video>
  </section>

  <!-- Socket.io client UMD bundle (exposes window.io) -->
  <script src="../node_modules/socket.io-client/dist/socket.io.js"></script>
  <!-- App renderer logic -->
  <script src="app.js" type="module"></script>

</body>
</html>
